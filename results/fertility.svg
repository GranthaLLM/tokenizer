<text x="20" y="520" class="mut">Grantha is trained on Sanskrit and English only. The others are general multilingual tokenizers.</text>
<text x="20" y="536" class="mut">On DCS and GRETIL, Grantha also trained on other works from those collections.</text>
<text x="20" y="552" class="mut">Fewer tokens is cheaper to process, not necessarily better quality. No full-scale model has been trained on it yet.</text>
